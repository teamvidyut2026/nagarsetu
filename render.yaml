services:
  - type: web
    name: nagarsetu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn nagarsetu.server:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/meta
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false   # set in the Render dashboard; without it the app runs in offline mode
